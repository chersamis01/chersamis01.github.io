<script>
$(function(){


// ※西暦を表示
const fullYear = new Date().getFullYear();
// const fullYear = 2027; ※来年以降の確認、仮で入力してみる
console.log(fullYear);

if(fullYear >= 2027){
$('#this-year').text('2026 - ' + fullYear);
}else{
$('#this-year').text(fullYear);
}

// ※ハンバーガーボタン
// #ham-btnをon.clickしたら
$('#ham-btn').on('click',function(){
$(this).toggleClass('is-active');

$('#sp-nav').fadeToggle(600)
});

// ※#sp-nav a をon.clickしたら
$('#sp-nav a').on('click',function(){
$('#sp-nav').fadeOut(600);
$('#ham-btn').removeClass('is-active');
});

// ※ajaxでリダイレクト(入力データを、完了フォームへ送る)
$('#g-form').submit(function (event) {
const formData = $('#g-form').serialize();
$.ajax({
  url: "https://docs.google.com/forms/u/0/d/e/1FAIpQLSfyufSJFVNKlTZqfGCvpyUJgxh6x5ranKDLc42xoWf5Kx5kkQ/formResponse",
  data: formData,
  type: "POST",
  dataType: "xml",
  statusCode: {
    0: function(){
      window.location.href = "thanks.html"; /* ※移動先のパス */
      },
    200: function(){
     //失敗したときの処理
      }
    }
  });
//googleformへのページ遷移をキャンセル
event.preventDefault();
});




});

</script>
