<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gridを使ったレイアウト</title>

<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
}

.grid-wrapper{
max-width: 600px;
aspect-ratio: 1/1;
background-color: #98d2e0a4;
margin: 100px auto;
display: grid;
gap: 10px;

>p{
background-color: #276f15;
&:nth-of-type(1){
grid-column: 1/3;
grid-row: 1/3;
}

&:nth-of-type(2){
grid-column: 3/4;
grid-row: 1/3;  
background-color: #503da3;
}

&:nth-of-type(3){
grid-column: 1/2;
grid-row: 3/4;
background-color: #f5f234;
}

&:nth-of-type(4){
grid-column: 2/4;
grid-row: 3/4;
background-color: #cb5d87;
}
}
}


</style>

</head>
<body>
<div class="grid-wrapper">

<p>1</p>
<p>2</p>
<p>3</p>
<p>4</p>

</div>

  
</body>
</html>
